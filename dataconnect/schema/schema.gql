type User @table {
  displayName: String!
  createdAt: Timestamp!
  email: String
  photoUrl: String
  bio: String
}

type Movie @table {
  title: String!
  year: Int!
  createdAt: Timestamp!
  summary: String
  genres: [String]
  runtimeMinutes: Int
  posterUrl: String
}

type Watch @table {
  user: User
  movie: Movie
  watchDate: Date!
  createdAt: Timestamp!
  location: String
}

type Review @table {
  user: User
  movie: Movie
  watch: Watch
  rating: Int!
  createdAt: Timestamp!
  updatedAt: Timestamp!
  isPublic: Boolean!
  reviewText: String
  privateShareLink: UUID
}

type List @table {
  user: User
  name: String!
  isPublic: Boolean!
  createdAt: Timestamp!
  updatedAt: Timestamp!
  description: String
  privateShareLink: UUID
}

type ListItem @table(key: ["list", "movie"]) {
  list: List!
  movie: Movie!
  position: Int!
  note: String
}